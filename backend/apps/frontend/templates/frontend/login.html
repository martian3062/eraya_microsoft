{% load static %}<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eraya — Sign In</title>
<script>(function(){var t=localStorage.getItem('eraya-theme')||'dark';document.documentElement.classList.toggle('dark',t==='dark');}());</script>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'}</script>
<style>
body{margin:0;overflow:hidden;}
#attractor-canvas{position:fixed;inset:0;z-index:0;}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 60% 80% at 20% 50%,rgba(6,13,26,.3) 0%,rgba(6,13,26,.7) 100%);}
html:not(.dark) .veil{background:radial-gradient(ellipse 60% 80% at 20% 50%,rgba(253,250,244,.2) 0%,rgba(253,250,244,.6) 100%);}
.glass-card{background:rgba(12,22,40,.75);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(20px);}
html:not(.dark) .glass-card{background:rgba(255,255,255,.82);border-color:rgba(0,0,0,.08);}
.inp{width:100%;padding:10px 14px;border-radius:12px;font-size:13px;outline:none;transition:all .2s;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;}
html:not(.dark) .inp{background:rgba(255,255,255,.9);border-color:#e2e8f0;color:#1e293b;}
.inp:focus{border-color:#2dd4bf;box-shadow:0 0 0 3px rgba(45,212,191,.15);}
.inp::placeholder{color:rgba(255,255,255,.3);}
html:not(.dark) .inp::placeholder{color:#94a3b8;}
.btn-primary{width:100%;padding:11px;border-radius:12px;font-size:13px;font-weight:600;color:#fff;
  background:linear-gradient(to right,#0d9488,#06b6d4);transition:all .2s;border:none;cursor:pointer;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;}
.btn-outline{width:100%;padding:11px;border-radius:12px;font-size:13px;font-weight:500;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.85);
  transition:all .2s;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}
html:not(.dark) .btn-outline{background:rgba(255,255,255,.9);border-color:#e2e8f0;color:#374151;}
.btn-outline:hover{background:rgba(255,255,255,.12);}
html:not(.dark) .btn-outline:hover{background:#fff;}
.err{display:flex;align-items:center;gap:6px;font-size:11px;color:#f87171;
  background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);border-radius:10px;padding:8px 12px;}
.snippet{position:fixed;font-family:monospace;font-size:10px;letter-spacing:.04em;white-space:nowrap;pointer-events:none;z-index:2;transition:opacity 1.2s,transform 1.2s;}
</style>
</head>
<body class="bg-[#060d1a] dark:bg-[#060d1a]" style="background:linear-gradient(135deg,#08041a 0%,#0c1228 40%,#050f18 100%)">

<canvas id="attractor-canvas"></canvas>
<div class="veil"></div>
<div id="snippets-layer" style="position:fixed;inset:0;z-index:2;pointer-events:none"></div>

<!-- Logo -->
<div style="position:fixed;top:24px;left:28px;z-index:10;display:flex;align-items:center;gap:10px">
  <div style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#fb923c,#2dd4bf);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;box-shadow:0 4px 12px rgba(45,212,191,.3)">E</div>
  <span style="font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)">Eraya</span>
</div>

<!-- Theme toggle -->
<button id="theme-btn" onclick="toggleTheme()" style="position:fixed;top:20px;right:24px;z-index:10;width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all .2s" onmouseover="this.style.background='rgba(255,255,255,.15)'" onmouseout="this.style.background='rgba(255,255,255,.08)'">
  <span id="t-sun" class="hidden">☀️</span>
  <span id="t-moon">🌙</span>
</button>

<!-- Login card -->
<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:64px;z-index:10">
  <div class="glass-card" style="width:288px;padding:28px;border-radius:20px;box-shadow:0 32px 80px rgba(0,0,0,.5)">
    <h1 style="font-size:20px;font-weight:700;color:#fff;margin:0 0 4px" class="dark:text-white" id="card-title">Sign in</h1>
    <p style="font-size:13px;color:rgba(255,255,255,.38);margin:0 0 20px">Self-healing agent console</p>

    {% if error %}
    <div class="err" style="margin-bottom:16px">⚠ {{ error|title }}</div>
    {% endif %}

    <!-- STEP: entry -->
    <div id="step-entry" class="step">
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn-primary" onclick="showStep('name')">
          🛡 Operator
        </button>
        <button class="btn-outline" onclick="showStep('email')">
          ✉️ Sign in with Email
        </button>
        <a href="/auth/google/" style="text-decoration:none">
          <button class="btn-outline" style="width:100%">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Continue with Google
          </button>
        </a>
        <a href="/auth/guest/" style="text-decoration:none">
          <button class="btn-outline" style="color:rgba(255,255,255,.35);width:100%;font-size:12px">👤 Guest</button>
        </a>
      </div>
    </div>

    <!-- STEP: name (operator) -->
    <div id="step-name" class="step" style="display:none">
      <div style="display:flex;flex-direction:column;gap:12px">
        <input id="inp-name" class="inp" type="text" placeholder="Your name" autofocus
               onkeydown="if(event.key==='Enter')doOperator()">
        <button class="btn-primary" onclick="doOperator()">Enter</button>
        <button onclick="showStep('entry')" style="background:none;border:none;color:rgba(255,255,255,.3);font-size:12px;cursor:pointer;padding:4px">← Back</button>
      </div>
    </div>

    <!-- STEP: email (sign in) -->
    <div id="step-email" class="step" style="display:none">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div id="err-email" class="err" style="display:none"></div>
        <input id="inp-email" class="inp" type="email" placeholder="Email" autofocus onkeydown="if(event.key==='Enter')doLogin()">
        <input id="inp-pass" class="inp" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
        <button id="btn-login" class="btn-primary" onclick="doLogin()">🔒 Sign in</button>
        <div style="display:flex;justify-content:space-between;padding-top:4px">
          <button onclick="showStep('register')" style="background:none;border:none;font-size:11px;color:#2dd4bf;cursor:pointer">Create account →</button>
          <button onclick="showStep('entry')" style="background:none;border:none;font-size:11px;color:rgba(255,255,255,.25);cursor:pointer">← Back</button>
        </div>
      </div>
    </div>

    <!-- STEP: register -->
    <div id="step-register" class="step" style="display:none">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div id="err-reg" class="err" style="display:none"></div>
        <input id="inp-rname" class="inp" type="text" placeholder="Your name (optional)" autofocus>
        <input id="inp-remail" class="inp" type="email" placeholder="Email" onkeydown="if(event.key==='Enter')doRegister()">
        <input id="inp-rpass" class="inp" type="password" placeholder="Password (min 6 chars)" onkeydown="if(event.key==='Enter')doRegister()">
        <button id="btn-reg" class="btn-primary" onclick="doRegister()">✨ Create account</button>
        <div style="display:flex;justify-content:space-between;padding-top:4px">
          <button onclick="showStep('email')" style="background:none;border:none;font-size:11px;color:#2dd4bf;cursor:pointer">Already have account →</button>
          <button onclick="showStep('entry')" style="background:none;border:none;font-size:11px;color:rgba(255,255,255,.25);cursor:pointer">← Back</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="{% static 'frontend/js/attractor.js' %}"></script>
<script>
// ── Theme ──────────────────────────────────────────────────────────────────
function toggleTheme(){
  const d=document.documentElement.classList.toggle('dark');
  localStorage.setItem('eraya-theme',d?'dark':'light');
  document.getElementById('t-sun').classList.toggle('hidden',!d);
  document.getElementById('t-moon').classList.toggle('hidden',d);
}
const isDark=document.documentElement.classList.contains('dark');
document.getElementById('t-sun').classList.toggle('hidden',!isDark);
document.getElementById('t-moon').classList.toggle('hidden',isDark);

// ── Steps ──────────────────────────────────────────────────────────────────
function showStep(name){
  document.querySelectorAll('.step').forEach(el=>el.style.display='none');
  document.getElementById('step-'+name).style.display='';
  const titles={entry:'Sign in',name:'Enter your name',email:'Sign in',register:'Create account'};
  document.getElementById('card-title').textContent=titles[name]||'Sign in';
  const inp={name:'inp-name',email:'inp-email',register:'inp-rname'}[name];
  if(inp)setTimeout(()=>document.getElementById(inp)?.focus(),50);
}

// ── Operator ──────────────────────────────────────────────────────────────
function doOperator(){
  const name=document.getElementById('inp-name').value.trim()||'Operator';
  const fd=new FormData();fd.append('name',name);
  fetch('/auth/operator/',{method:'POST',body:fd,headers:{'X-CSRFToken':getCookie('csrftoken')}})
    .then(()=>location.href='/dashboard/');
}

// ── Email login ────────────────────────────────────────────────────────────
async function doLogin(){
  const btn=document.getElementById('btn-login');
  const err=document.getElementById('err-email');
  const email=document.getElementById('inp-email').value.trim();
  const pass=document.getElementById('inp-pass').value;
  err.style.display='none';
  if(!email||!pass){showErr(err,'Enter email and password.');return;}
  btn.disabled=true;btn.textContent='Please wait…';
  const res=await fetch('/auth/login/',{method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
    body:JSON.stringify({email,password:pass})});
  if(res.ok){location.href='/dashboard/';}
  else{const d=await res.json();showErr(err,d.error||'Invalid credentials.');}
  btn.disabled=false;btn.textContent='🔒 Sign in';
}

// ── Register ───────────────────────────────────────────────────────────────
async function doRegister(){
  const btn=document.getElementById('btn-reg');
  const err=document.getElementById('err-reg');
  const name=document.getElementById('inp-rname').value.trim();
  const email=document.getElementById('inp-remail').value.trim();
  const pass=document.getElementById('inp-rpass').value;
  err.style.display='none';
  if(!email||!pass){showErr(err,'Enter email and password.');return;}
  btn.disabled=true;btn.textContent='Please wait…';
  const res=await fetch('/auth/register/',{method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},
    body:JSON.stringify({email,password:pass,name})});
  if(res.ok){location.href='/dashboard/';}
  else{const d=await res.json();showErr(err,d.error||'Registration failed.');}
  btn.disabled=false;btn.textContent='✨ Create account';
}

function showErr(el,msg){el.textContent='⚠ '+msg;el.style.display='flex';}
function getCookie(n){const c=document.cookie.split(';').find(c=>c.trim().startsWith(n+'='));return c?decodeURIComponent(c.trim().slice(n.length+1)):'';}

// ── Floating tech snippets ─────────────────────────────────────────────────
const SNIPS=['perceiver·87ms','BLOCKED·R003','rsrp:−87dBm','planner·groq','self-heal→pod','cpu:84%→ok','a2a·7429','otel·8c2f…','hrv_alert·4B','anomaly·killed','recoverer·v2.3','kavacha·stopped','slo:99.1%','guardian·ok'];
const SLOTS=[{x:4,y:8},{x:38,y:5},{x:20,y:18},{x:8,y:36},{x:34,y:48},{x:48,y:42},{x:15,y:58},{x:40,y:64},{x:6,y:74},{x:28,y:80},{x:44,y:86}];
const layer=document.getElementById('snippets-layer');
const spans=SLOTS.map((pos,i)=>{
  const el=document.createElement('span');
  el.className='snippet';
  el.style.cssText=`left:${pos.x}%;top:${pos.y}%;opacity:0;transform:translateY(8px);color:#2dd4bf;font-size:10px;`;
  el.textContent=SNIPS[i%SNIPS.length];
  layer.appendChild(el);
  return el;
});
let visSet=new Set([0,1,2,3,4]);
spans.forEach((el,i)=>{if(visSet.has(i)){el.style.opacity='.65';el.style.transform='translateY(0)';}});
setInterval(()=>{
  const i=Math.floor(Math.random()*spans.length);
  if(visSet.has(i)){visSet.delete(i);spans[i].style.opacity='0';spans[i].style.transform='translateY(8px)';}
  else{spans[i].textContent=SNIPS[Math.floor(Math.random()*SNIPS.length)];visSet.add(i);spans[i].style.opacity='.6';spans[i].style.transform='translateY(0)';}
},1400);
</script>
</body>
</html>
