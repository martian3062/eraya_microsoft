{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERAYA Casper — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1d0718;--fg:#f6efec;--fg2:rgba(246,239,236,.66);--fg3:rgba(246,239,236,.40);
  --card:rgba(255,255,255,.035);--card-hi:rgba(255,255,255,.055);--bd:rgba(255,225,222,.10);
  --a:#ff6f91;--a-soft:#ffd9de;--a-deep:#e6416f;--rose:#ff8fb0;
  --grad-brand:linear-gradient(95deg,#ffd9de,#ff6f91 38%,#ff8fb0 76%,#e6416f);
  --grad-btn:linear-gradient(180deg,#ff8aa6,#e6416f);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}html,body{margin:0;height:100%}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}}
body{background:var(--bg);color:var(--fg);font-family:Inter,sans-serif;font-size:14px;line-height:1.55;overflow:hidden}
#bg{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(85% 70% at 18% 8%, rgba(140,32,84,.34), transparent 62%),
  radial-gradient(70% 60% at 78% 112%, rgba(255,143,176,.20), transparent 60%),
  radial-gradient(45% 40% at 96% 0%, rgba(70,12,44,.55), transparent 55%),
  linear-gradient(135deg,#210817 0%,#2b0b1e 46%,#180611 100%)}
#bg::after{content:"";position:absolute;inset:0;opacity:.03;background-image:radial-gradient(rgba(255,255,255,.7) .5px,transparent .5px);background-size:3px 3px}
.brand{font-family:'Space Grotesk',sans-serif}
.logo-word{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-1.1px;line-height:.95;background:var(--grad-brand);-webkit-background-clip:text;background-clip:text;color:transparent}
::selection{background:rgba(255,111,145,.32);color:#fff}
:focus-visible{outline:2px solid var(--a);outline-offset:2px;border-radius:6px}

/* Loading screen */
#loader{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .8s}
#loader.hide{opacity:0;pointer-events:none}
#loader .logo-word{font-size:clamp(48px,10vw,74px);animation:lin 1.1s ease both}
@keyframes lin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.tag{font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--fg2);margin-top:8px}
.lbar{width:180px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);margin:24px auto 0;overflow:hidden}
.lbar span{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--a),transparent);animation:lbar 1.15s ease-in-out infinite}
@keyframes lbar{0%{transform:translateX(-130%)}100%{transform:translateX(330%)}}

/* Sign-in */
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#signin{width:340px;max-width:calc(100vw - 40px);opacity:0;transform:translateY(14px);transition:opacity .7s,transform .7s}
#signin.show{opacity:1;transform:none}
.card{background:linear-gradient(180deg,var(--card-hi),var(--card) 26%);border:1px solid var(--bd);border-radius:22px;padding:30px 28px;backdrop-filter:blur(16px);box-shadow:0 30px 70px -30px rgba(0,0,0,.7)}
.head{display:flex;flex-direction:column;align-items:flex-start;margin-bottom:22px}
.head .logo-word{font-size:30px}
.head h1{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin:14px 0 2px}
.head p{font-size:12px;color:var(--fg3);margin:0}
.col{display:flex;flex-direction:column;gap:10px}
.btn{border:none;border-radius:12px;padding:12px 15px;font-weight:600;font-size:13.5px;cursor:pointer;transition:transform .18s var(--ease),filter .18s var(--ease),background .18s var(--ease),border-color .18s var(--ease);display:flex;align-items:center;justify-content:center;gap:8px;font-family:Inter,sans-serif}
.btn-primary{background:var(--grad-btn);color:#2b0a18;box-shadow:0 8px 22px -12px rgba(230,65,111,.85),inset 0 1px 0 rgba(255,255,255,.34)}
.btn-primary:hover{transform:translateY(-1px);filter:brightness(1.06)}
.btn-primary:active{transform:translateY(0) scale(.985)}
.btn-outline{background:rgba(255,255,255,.05);border:1px solid var(--bd);color:var(--fg)}
.btn-outline:hover{background:rgba(255,255,255,.09);border-color:rgba(255,111,145,.34)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.inp{width:100%;padding:12px 14px;border-radius:11px;background:rgba(255,255,255,.04);border:1px solid var(--bd);color:var(--fg);font-size:13.5px;font-family:Inter,sans-serif}
.inp:focus{outline:none;border-color:rgba(255,111,145,.5)}
.inp::placeholder{color:var(--fg3)}
.link{background:none;border:none;color:var(--a);cursor:pointer;font-size:11.5px;font-family:Inter,sans-serif;padding:2px}
.back{background:none;border:none;color:var(--fg3);cursor:pointer;font-size:11.5px;font-family:Inter,sans-serif;padding:2px}
.err{display:none;background:rgba(230,65,111,.12);border:1px solid rgba(230,65,111,.3);color:#ffb3a6;font-size:12px;padding:9px 11px;border-radius:10px}
.divider{display:flex;align-items:center;gap:10px;color:var(--fg3);font-size:10px;margin:2px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--bd)}
.strip{margin-top:18px;padding:11px 13px;border-radius:12px;background:rgba(255,111,145,.06);border:1px solid rgba(255,111,145,.16)}
.strip .t{font-size:11px;color:var(--fg2);line-height:1.6}
.strip b{color:var(--a)}
.step{display:none}.step.on{display:block;animation:sf .3s ease}
@keyframes sf{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
</style>
</head>
<body>
<div id="bg"></div>

<div id="loader">
  <div style="text-align:center">
    <div class="logo-word">eraya</div>
    <div class="tag">: one that moves toward, navigates, adapts</div>
    <div class="lbar"><span></span></div>
  </div>
</div>

<div class="wrap">
  <div id="signin">
    <div class="card">
      <div class="head">
        <div class="logo-word">eraya</div>
        <h1>Sign in to ERAYA Casper</h1>
        <p>Self-healing agentic DeFi treasury swarm</p>
      </div>

      {% if error %}<div class="err" style="display:block;margin-bottom:14px">⚠ {{ error|capfirst }}</div>{% endif %}

      <!-- entry -->
      <div id="step-entry" class="step on">
        <div class="col">
          <button class="btn btn-primary" onclick="doGuest()"> Continue as guest</button>
          <div class="divider">or</div>
          <button class="btn btn-outline" onclick="showStep('email')"> Sign in with email</button>
          <button class="btn btn-outline" onclick="showStep('name')"> Operator access</button>
        </div>
        <div class="strip"><div class="t"><b>ERAYA Casper</b> · self-healing agent swarm<br>Perceiver · Planner · Recoverer · Guardian</div></div>
      </div>

      <!-- operator -->
      <div id="step-name" class="step">
        <div class="col">
          <input id="inp-name" class="inp" type="text" placeholder="Your name" autocomplete="name" onkeydown="if(event.key==='Enter')doOperator()">
          <button class="btn btn-primary" onclick="doOperator()">→&nbsp; Enter console</button>
          <button class="back" onclick="showStep('entry')">← Back</button>
        </div>
      </div>

      <!-- email -->
      <div id="step-email" class="step">
        <div class="col">
          <div id="err-email" class="err"></div>
          <input id="inp-email" class="inp" type="email" placeholder="Email" onkeydown="if(event.key==='Enter')doLogin()">
          <input id="inp-pass" class="inp" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
          <button id="btn-login" class="btn btn-primary" onclick="doLogin()"> Sign in</button>
          <div style="display:flex;justify-content:space-between">
            <button class="link" onclick="showStep('register')">Create account →</button>
            <button class="back" onclick="showStep('entry')">← Back</button>
          </div>
        </div>
      </div>

      <!-- register -->
      <div id="step-register" class="step">
        <div class="col">
          <div id="err-reg" class="err"></div>
          <input id="inp-rname" class="inp" type="text" placeholder="Name">
          <input id="inp-remail" class="inp" type="email" placeholder="Email">
          <input id="inp-rpass" class="inp" type="password" placeholder="Password (min 6)">
          <button id="btn-reg" class="btn btn-primary" onclick="doRegister()"> Create account</button>
          <button class="back" onclick="showStep('email')">← Back</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const _lm=location.pathname.match(/^\/(eraya_api|croo_api)\//);const API=_lm?'/'+_lm[1]:'';
function getCookie(n){const c=document.cookie.split(';').find(c=>c.trim().startsWith(n+'='));return c?decodeURIComponent(c.trim().slice(n.length+1)):'';}
function showStep(name){document.querySelectorAll('.step').forEach(el=>el.classList.remove('on'));const el=document.getElementById('step-'+name);if(el)el.classList.add('on');const inp={name:'inp-name',email:'inp-email',register:'inp-rname'}[name];if(inp)setTimeout(()=>document.getElementById(inp)?.focus(),60);}
function showErr(el,msg){el.textContent=msg;el.style.display='block';}
function doGuest(){fetch(API+'/auth/guest/').then(()=>location.href=API+'/app/');}
function doOperator(){const name=document.getElementById('inp-name').value.trim()||'Operator';const fd=new FormData();fd.append('name',name);fetch(API+'/auth/operator/',{method:'POST',body:fd,headers:{'X-CSRFToken':getCookie('csrftoken')}}).then(()=>location.href=API+'/app/');}
async function doLogin(){const btn=document.getElementById('btn-login'),err=document.getElementById('err-email');const email=document.getElementById('inp-email').value.trim(),pass=document.getElementById('inp-pass').value;err.style.display='none';if(!email||!pass){showErr(err,'Enter email and password.');return;}btn.disabled=true;btn.textContent='Please wait…';const res=await fetch(API+'/auth/login/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},body:JSON.stringify({email,password:pass})});if(res.ok){location.href=API+'/app/';}else{const d=await res.json().catch(()=>({}));showErr(err,d.error||'Invalid credentials.');}btn.disabled=false;btn.innerHTML=' Sign in';}
async function doRegister(){const btn=document.getElementById('btn-reg'),err=document.getElementById('err-reg');const name=document.getElementById('inp-rname').value.trim(),email=document.getElementById('inp-remail').value.trim(),pass=document.getElementById('inp-rpass').value;err.style.display='none';if(!email||!pass){showErr(err,'Enter email and password.');return;}btn.disabled=true;btn.textContent='Please wait…';const res=await fetch(API+'/auth/register/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},body:JSON.stringify({email,password:pass,name})});if(res.ok){location.href=API+'/app/';}else{const d=await res.json().catch(()=>({}));showErr(err,d.error||'Registration failed.');}btn.disabled=false;btn.innerHTML=' Create account';}
setTimeout(()=>{document.getElementById('loader').classList.add('hide');document.getElementById('signin').classList.add('show');},1800);
</script>
</body>
</html>
