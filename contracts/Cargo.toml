[package]
name = "eraya-contracts"
version = "0.1.0"
edition = "2021"

[dependencies]
odra = { version = "1.4.0", default-features = false }

[dev-dependencies]
odra-test = "1.4.0"

[build-dependencies]
odra-build = "1.4.0"

[[bin]]
name = "eraya_contracts_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "eraya_contracts_build_schema"
path = "bin/build_schema.rs"
test = false

[profile.release]
codegen-units = 1
lto = true

[lib]
name = "eraya_contracts"
